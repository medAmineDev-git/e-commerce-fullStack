<h1>{{ isEditMode() ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</h1>

<form (submit)="$event.preventDefault()" class="category-form">
	<mat-form-field appearance="outline">
		<mat-label>Nom</mat-label>
		<input
			matInput
			[value]="model().name"
			(input)="updateTextField('name', $any($event.target).value)"
			(blur)="touch('name')"
			required
		/>
		@if ((submitted() || touched().name) && errors().name) {
			<mat-error>{{ errors().name }}</mat-error>
		}
	</mat-form-field>

	<mat-form-field appearance="outline">
		<mat-label>Description</mat-label>
		<textarea
			matInput
			rows="3"
			[value]="model().description"
			(input)="updateTextField('description', $any($event.target).value)"
			(blur)="touch('description')"
		></textarea>
	</mat-form-field>

	<mat-form-field appearance="outline">
		<mat-label>Catégorie parent</mat-label>
		<select matNativeControl [value]="model().parentId ?? ''" (change)="updateParent($any($event.target).value)">
			<option value="">Catégorie principale</option>
			@for (parent of parentCategories(); track parent.id) {
				<option [value]="parent.id">{{ parent.name }}</option>
			}
		</select>
	</mat-form-field>

	<div class="form-actions">
		<button mat-button type="button" (click)="cancel()">Annuler</button>
		<button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="saving() || !formValid()">
			{{ saving() ? 'Enregistrement...' : isEditMode() ? 'Modifier la catégorie' : 'Créer la catégorie' }}
		</button>
	</div>
</form>
