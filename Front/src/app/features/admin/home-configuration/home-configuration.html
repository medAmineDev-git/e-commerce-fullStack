<section class="page-header">
  <div>
    <p class="eyebrow">Boutique</p>
    <h1>Texte d'accueil</h1>
    <p>Le titre et l'accroche affichés sous la bannière de votre vitrine.</p>
  </div>
</section>

@if (loading()) {
  <p class="state">Chargement...</p>
} @else {
  <form class="configuration-form" (submit)="$event.preventDefault()">
    <section class="form-card">
      <!-- Le texte reste enregistré quand il est masqué : le retirer de la
           vitrine ne doit pas obliger à le ressaisir pour le remettre. -->
      <label class="toggle">
        <input type="checkbox" [checked]="welcomeEnabled()" (change)="toggleWelcome()" />
        <span class="toggle__body">
          <span class="toggle__label">Afficher ce texte sur la vitrine</span>
          <span class="toggle__hint">
            @if (welcomeEnabled()) {
              Le titre et l'accroche paraissent sous la bannière.
            } @else {
              Le texte est conservé ici mais n'apparaît pas sur votre vitrine.
            }
          </span>
        </span>
      </label>

      <label class="field">
        <span>Titre *</span>
        <input
          [value]="title()"
          (input)="title.set($any($event.target).value)"
          maxlength="160"
          placeholder="Bienvenue à l'Atelier"
          required
        />
      </label>

      <label class="field">
        <span>Texte *</span>
        <textarea
          rows="5"
          [value]="text()"
          (input)="text.set($any($event.target).value)"
          maxlength="1200"
          placeholder="Une sélection choisie avec soin, expédiée depuis notre atelier."
          required
        ></textarea>
      </label>

      @if (message()) { <p class="success">{{ message() }}</p> }
      @if (error()) { <p class="error">{{ error() }}</p> }

      <button type="button" (click)="save()" [disabled]="!canSave()">
        {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </section>
  </form>
}
