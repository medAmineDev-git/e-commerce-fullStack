<mat-toolbar color="primary">
  <!-- Bouton d'ouverture du menu, sur telephone uniquement : sur grand ecran le
       menu est ancre a gauche et n'a rien a basculer. -->
  @if (isHandset()) {
    <button type="button" class="menu-button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span class="u-sr-only">{{ menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}</span>
      <mat-icon aria-hidden="true">{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  }
  <a class="brand" routerLink="/admin/dashboard">Atelier Commerce</a>
  <span class="toolbar-spacer"></span>
  <a class="shop-link" [href]="storefrontUrl()" target="_blank" rel="noopener">Voir ma vitrine</a>
  @if (isPlatformOperator()) {
    <a class="shop-link" routerLink="/plateforme">Plateforme</a>
  }
  <button type="button" class="logout-button" (click)="logout()">Déconnexion</button>
</mat-toolbar>

<mat-sidenav-container class="admin-container">
  <mat-sidenav
    class="admin-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? menuOpen() : true"
    (closedStart)="closeMenu()"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>space_dashboard</mat-icon>
        <span matListItemTitle>Vue d'ensemble</span>
      </a>
      <a mat-list-item routerLink="/admin/configuration" routerLinkActive="active-link">
        <mat-icon matListItemIcon>tune</mat-icon>
        <span matListItemTitle>Configuration</span>
      </a>
      <a mat-list-item routerLink="/admin/products" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Produits</span>
      </a>
      <a mat-list-item routerLink="/admin/categories" routerLinkActive="active-link">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Catalogues</span>
      </a>
      <a mat-list-item routerLink="/admin/orders" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Commandes</span>
      </a>
      <a mat-list-item routerLink="/admin/home" routerLinkActive="active-link">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Accueil</span>
      </a>
      <a mat-list-item routerLink="/admin/reassurance" routerLinkActive="active-link">
        <mat-icon matListItemIcon>verified</mat-icon>
        <span matListItemTitle>Réassurance</span>
      </a>
      <a mat-list-item routerLink="/admin/pages" routerLinkActive="active-link">
        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Pages</span>
      </a>
      <!-- En dernier : on y vient pour régler, pas pour travailler chaque jour. -->
      <a mat-list-item routerLink="/admin/parametres" routerLinkActive="active-link">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Paramètres</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content admin-scope">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
