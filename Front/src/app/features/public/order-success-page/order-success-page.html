<section class="success-wrap">
  <p class="ok">Commande confirmee</p>
  <h1>Merci pour ton achat</h1>
  <p class="meta">Numero: {{ orderId() }}</p>

  <div class="card">
    <div>
      <span>Total</span>
      <strong>{{ total() | currency: 'EUR' : 'symbol' : '1.2-2' : 'fr' }}</strong>
    </div>
    <div>
      <span>Livraison estimee</span>
      <strong>{{ eta() }}</strong>
    </div>
    <p>Paiement a la livraison: reglement au moment de reception.</p>
  </div>

  <div class="actions">
    <a [routerLink]="storeContext.link('shop')">Continuer mes achats</a>
    <a [routerLink]="storeContext.link()">Retour à la boutique</a>
  </div>
</section>
