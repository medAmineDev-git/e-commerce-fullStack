spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Taille des visuels, valable sur tous les profils.
# Elle etait declaree uniquement en dev : en production Spring Boot plafonnait
# a 1 Mo par defaut, alors que le service de stockage annonce 5 Mo.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
