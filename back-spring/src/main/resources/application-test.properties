# Profil de test
# Base H2 en memoire pour des tests rapides et isoles
spring.datasource.url=jdbc:h2:mem:ecommerce_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false
app.security.jwt-secret=test-signing-secret
