openapi: 3.0.3
info:
  title: E-commerce Back Spring API
  version: 1.0.0
  description: |
    Documentation OpenAPI du backend Spring.
    Inclut le CRUD produits, la recherche paginee et la route dev de reseed.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Products
    description: Product CRUD and search
  - name: Categories
    description: Category CRUD
  - name: Orders
    description: Checkout order placement
  - name: Dev
    description: Development-only utilities

paths:
  /api/products:
    get:
      tags: [Products]
      summary: Get all products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags: [Products]
      summary: Update product by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags: [Products]
      summary: Delete product by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/products/page:
    get:
      tags: [Products]
      summary: Search products with pagination and sorting
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ''
          description: Search text in name/description
        - name: category
          in: query
          required: false
          schema:
            type: string
            default: ''
            enum: ['', Homme, Femme, Sneakers, Accessoires]
          description: Exact category filter (invalid values ignored by service)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 100
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: id
            enum: [id, name, price, stockQuantity]
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: Paged result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'

  /api/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags: [Categories]
      summary: Update category by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags: [Categories]
      summary: Delete category by id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/orders:
    post:
      tags: [Orders]
      summary: Place checkout order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/dev/catalog/reseed:
    post:
      tags: [Dev]
      summary: Reseed dev catalog (dev profile only)
      description: Endpoint is registered only when SPRING_PROFILES_ACTIVE=dev.
      responses:
        '200':
          description: Catalog reseeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevCatalogReseedResponse'
        '404':
          description: Endpoint unavailable outside dev profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ProductRequest:
      type: object
      required: [name, category, description, price, stockQuantity]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
          format: decimal
          exclusiveMinimum: 0
        stockQuantity:
          type: integer
          minimum: 0

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        stockQuantity:
          type: integer

    ProductPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean
        sortBy:
          type: string
        sortDirection:
          type: string
        query:
          type: string
        category:
          type: string

    CategoryRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string

    OrderRequest:
      type: object
      required: [customerName, phone, city, address, paymentMethod, items]
      properties:
        customerName:
          type: string
        phone:
          type: string
        city:
          type: string
        address:
          type: string
        note:
          type: string
        paymentMethod:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        total:
          type: number
          format: decimal
          description: Ignored by the server; the response total is calculated from current product prices.

    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        estimatedDelivery:
          type: string
        total:
          type: number
          format: decimal
        status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    OrderItemResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitPrice:
          type: number
          format: decimal
        quantity:
          type: integer

    DevCatalogReseedResponse:
      type: object
      properties:
        message:
          type: string
        insertedCount:
          type: integer

    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string
